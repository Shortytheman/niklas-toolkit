name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    name: Validate plugin manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate --strict .
      - run: |
          for pack in packs/*/; do
            claude plugin validate --strict "$pack"
          done

  test:
    name: Script tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    env:
      GODOT_VERSION: 4.7.2-stable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest "gdtoolkit==4.*"
      - name: Download Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"
      - run: python tools/sync_shared.py --check
      - run: python -m pytest -v tests

  windows:
    name: Script tests (Windows, Python 3.12)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install pytest "gdtoolkit==4.*"
      - run: python -m pytest -v tests
